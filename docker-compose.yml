services:
  # --- Custom-built servers (this GitHub org, images built by each repo's own CI) ---

  sonarr-mcp:
    image: ghcr.io/barrow1990/sonarr-mcp-server:latest
    container_name: sonarr-mcp
    environment:
      SONARR_URL: ${SONARR_URL:?}
      SONARR_API_KEY: ${SONARR_API_KEY:?}
      MCP_AUTH_TOKEN: ${SONARR_MCP_AUTH_TOKEN:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8931
    ports:
      - "8931:8931"
    restart: unless-stopped

  radarr-mcp:
    image: ghcr.io/barrow1990/radarr-mcp-server:latest
    container_name: radarr-mcp
    environment:
      RADARR_URL: ${RADARR_URL:?}
      RADARR_API_KEY: ${RADARR_API_KEY:?}
      MCP_AUTH_TOKEN: ${RADARR_MCP_AUTH_TOKEN:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8932
    ports:
      - "8932:8932"
    restart: unless-stopped

  bazarr-mcp:
    image: ghcr.io/barrow1990/bazarr-mcp-server:latest
    container_name: bazarr-mcp
    environment:
      BAZARR_URL: ${BAZARR_URL:?}
      BAZARR_API_KEY: ${BAZARR_API_KEY:?}
      MCP_AUTH_TOKEN: ${BAZARR_MCP_AUTH_TOKEN:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8933
    ports:
      - "8933:8933"
    restart: unless-stopped

  prowlarr-mcp:
    image: ghcr.io/barrow1990/prowlarr-mcp-server:latest
    container_name: prowlarr-mcp
    environment:
      PROWLARR_URL: ${PROWLARR_URL:?}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:?}
      MCP_AUTH_TOKEN: ${PROWLARR_MCP_AUTH_TOKEN:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8934
    ports:
      - "8934:8934"
    restart: unless-stopped

  authentik-mcp:
    image: ghcr.io/barrow1990/authentik-mcp-server:latest
    container_name: authentik-mcp
    environment:
      AUTHENTIK_URL: ${AUTHENTIK_URL:?}
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN:?}
      AUTHENTIK_ALLOW_WRITES: ${AUTHENTIK_ALLOW_WRITES:-false}
      MCP_AUTH_TOKEN: ${AUTHENTIK_MCP_AUTH_TOKEN:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8937
    ports:
      - "8937:8937"
    restart: unless-stopped

  streamystats-mcp:
    image: ghcr.io/barrow1990/streamystats-mcp-server:latest
    container_name: streamystats-mcp
    environment:
      STREAMYSTATS_URL: ${STREAMYSTATS_URL:?}
      STREAMYSTATS_JELLYFIN_TOKEN: ${STREAMYSTATS_JELLYFIN_TOKEN:?}
      MCP_AUTH_TOKEN: ${STREAMYSTATS_MCP_AUTH_TOKEN:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8940
    ports:
      - "8940:8940"
    restart: unless-stopped

  reclaimerr-mcp:
    image: ghcr.io/barrow1990/reclaimerr-mcp-server:latest
    container_name: reclaimerr-mcp
    environment:
      RECLAIMERR_URL: ${RECLAIMERR_URL:?}
      RECLAIMERR_API_TOKEN: ${RECLAIMERR_API_TOKEN:?}
      MCP_AUTH_TOKEN: ${RECLAIMERR_MCP_AUTH_TOKEN:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8941
    ports:
      - "8941:8941"
    restart: unless-stopped

  # --- Third-party servers (see README for source/maintenance notes on each) ---

  dockhand-mcp:
    image: ghcr.io/strausmann/mcp-dockhand:latest
    container_name: dockhand-mcp
    environment:
      DOCKHAND_URL: ${DOCKHAND_URL:?}
      DOCKHAND_USERNAME: ${DOCKHAND_USERNAME:?}
      DOCKHAND_PASSWORD: ${DOCKHAND_PASSWORD:?}
      MCP_AUTH_TOKEN: ${DOCKHAND_MCP_AUTH_TOKEN:-}
      MCP_ALLOWED_HOSTS: ${DOCKHAND_MCP_ALLOWED_HOSTS:-}
      MCP_ALLOWED_ORIGINS: ${DOCKHAND_MCP_ALLOWED_ORIGINS:-}
    ports:
      - "8935:8080"
    restart: unless-stopped

  jellyfin-mcp:
    image: ghcr.io/jaredtrent/jellyfin-mcp:latest
    container_name: jellyfin-mcp
    environment:
      JELLYFIN_URL: ${JELLYFIN_URL:?}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:?}
      JELLYFIN_USER_ID: ${JELLYFIN_USER_ID:-}
    # Upstream's own compose binds 127.0.0.1 only and passes the bind
    # address and bearer token as CLI args, not env vars (confirmed from
    # their docker-compose.yml) — overridden here to bind 0.0.0.0 so it's
    # reachable from other hosts on the LAN, matching every other server in
    # this stack. JELLYFIN_HTTP_TOKEN is substituted here at `docker compose`
    # parse-time from the same root .env as everything else.
    command: ["--http", "--addr", "0.0.0.0:8080", "--http-token", "${JELLYFIN_HTTP_TOKEN:?}"]
    ports:
      - "8936:8080"
    restart: unless-stopped

  lubelogger-mcp:
    image: ghcr.io/hargata/lubelogger_mcp:latest
    container_name: lubelogger-mcp
    # LUBELOG_USER/LUBELOG_PASS deliberately optional (:-, not :?) and
    # deliberately left blank in .env.example — see the comment there. This
    # server takes its actual credential (a LubeLogger API key, ideally
    # Viewer-scoped) from the calling MCP CLIENT's own connection config
    # per request, not from a server-side variable; setting these two here
    # instead creates a full-account fallback anyone reaching this port can
    # ride for free.
    environment:
      LUBELOG_INSTANCE: ${LUBELOG_INSTANCE:?}
      LUBELOG_USER: ${LUBELOG_USER:-}
      LUBELOG_PASS: ${LUBELOG_PASS:-}
    ports:
      - "8938:8080"
    restart: unless-stopped

  seerr-mcp:
    image: ghcr.io/jhomen368/overseerr-mcp:latest
    container_name: seerr-mcp
    environment:
      SEERR_URL: ${SEERR_URL:?}
      SEERR_API_KEY: ${SEERR_API_KEY:?}
    ports:
      - "8939:8085"
    restart: unless-stopped
