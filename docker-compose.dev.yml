      BAZARR_URL: ${BAZARR_URL:?}
      BAZARR_API_KEY: ${BAZARR_API_KEY:?}
      MCP_AUTH_TOKEN: ${BAZARR_MCP_AUTH_TOKEN:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8933
    ports:
      - "18933:8933"
    restart: unless-stopped

  prowlarr-mcp:
    image: ghcr.io/barrow1990/prowlarr-mcp-server:dev
    pull_policy: always    # :dev is a moving tag
    container_name: prowlarr-mcp-dev
    environment:
      PROWLARR_URL: ${PROWLARR_URL:?}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:?}
      MCP_AUTH_TOKEN: ${PROWLARR_MCP_AUTH_TOKEN:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8934
    ports:
      - "18934:8934"
    restart: unless-stopped

  authentik-mcp:
    image: ghcr.io/barrow1990/authentik-mcp-server:dev
    pull_policy: always    # :dev is a moving tag
    container_name: authentik-mcp-dev
