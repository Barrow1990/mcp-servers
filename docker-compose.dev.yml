      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN:?}
      AUTHENTIK_ALLOW_WRITES: ${AUTHENTIK_ALLOW_WRITES:-false}
      MCP_AUTH_TOKEN: ${AUTHENTIK_MCP_AUTH_TOKEN:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8937
    ports:
      - "18937:8937"
