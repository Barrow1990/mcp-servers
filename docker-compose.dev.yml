  tracearr-mcp:
    image: ghcr.io/barrow1990/tracearr-mcp-server:dev
    pull_policy: always    # :dev is a moving tag
    container_name: tracearr-mcp-dev
    environment:
      TRACEARR_URL: ${TRACEARR_URL:?}
      TRACEARR_API_KEY: ${TRACEARR_API_KEY:?}
      TRACEARR_USERNAME: ${TRACEARR_USERNAME:-}
      TRACEARR_PASSWORD: ${TRACEARR_PASSWORD:-}
      MCP_AUTH_TOKEN: ${TRACEARR_MCP_AUTH_TOKEN:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8942
    ports:
      - "18942:8942"
    restart: unless-stopped
