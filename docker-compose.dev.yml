# DEV stack: the same servers as docker-compose.yml, running the `dev` branch of each
# repo's image (ghcr.io/barrow1990/<repo>:dev), side by side with production.
#
#   - image     :dev instead of :latest. Each repo's CI publishes :dev on every push to its
#               `dev` branch and never touches :latest; only a merge to main does that.
#   - ports     the production HOST port with a 1 in front (8931 -> 18931, ...). Container
#               ports are unchanged.
#   - names     `<service>-dev`, so both stacks can run on one host.
#   - env       identical variable names, so the dev stack takes its own copy of the values
#               (a separate Dockhand stack, or its own .env). No secrets live in this file.
#
# Only the servers built from this GitHub account's own repos are here. The third-party
# servers in docker-compose.yml (dockhand, jellyfin, lubelogger, seerr) are left out: they
# have no `dev` branch of their own to run. Add them if that changes.
#
# CAUTION: dev servers talk to the SAME Sonarr/Radarr/Bazarr/etc. as production with
# whatever credentials you give them, so a dev server's write tools act on your real apps.
#
# Dockhand: a git stack on this repo, compose path docker-compose.dev.yml, its own env.
# (Plain compose: `docker compose -f docker-compose.dev.yml up -d`.)

services:
  sonarr-mcp:
    image: ghcr.io/barrow1990/sonarr-mcp-server:dev
    pull_policy: always    # :dev is a moving tag
    container_name: sonarr-mcp-dev
    environment:
      SONARR_URL: ${SONARR_URL:?}
      SONARR_API_KEY: ${SONARR_API_KEY:?}
      MCP_AUTH_TOKEN: ${SONARR_MCP_AUTH_TOKEN:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8931
    ports:
      - "18931:8931"
    restart: unless-stopped

  radarr-mcp:
    image: ghcr.io/barrow1990/radarr-mcp-server:dev
    pull_policy: always    # :dev is a moving tag
    container_name: radarr-mcp-dev
    environment:
      RADARR_URL: ${RADARR_URL:?}
      RADARR_API_KEY: ${RADARR_API_KEY:?}
      MCP_AUTH_TOKEN: ${RADARR_MCP_AUTH_TOKEN:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8932
    ports:
      - "18932:8932"
    restart: unless-stopped

  bazarr-mcp:
    image: ghcr.io/barrow1990/bazarr-mcp-server:dev
    pull_policy: always    # :dev is a moving tag
    container_name: bazarr-mcp-dev
