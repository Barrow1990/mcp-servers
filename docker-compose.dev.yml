  streamystats-mcp:
    image: ghcr.io/barrow1990/streamystats-mcp-server:dev
    pull_policy: always    # :dev is a moving tag
    container_name: streamystats-mcp-dev
    environment:
      STREAMYSTATS_URL: ${STREAMYSTATS_URL:?}
      STREAMYSTATS_JELLYFIN_TOKEN: ${STREAMYSTATS_JELLYFIN_TOKEN:?}
      MCP_AUTH_TOKEN: ${STREAMYSTATS_MCP_AUTH_TOKEN:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8940
    ports:
      - "18940:8940"
    restart: unless-stopped

  reclaimerr-mcp:
    image: ghcr.io/barrow1990/reclaimerr-mcp-server:dev
    pull_policy: always    # :dev is a moving tag
    container_name: reclaimerr-mcp-dev
    environment:
      RECLAIMERR_URL: ${RECLAIMERR_URL:?}
      RECLAIMERR_API_TOKEN: ${RECLAIMERR_API_TOKEN:?}
      MCP_AUTH_TOKEN: ${RECLAIMERR_MCP_AUTH_TOKEN:-}
      MCP_HOST: 0.0.0.0
